<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Grace Pharmacy V13.1 Offline Pro</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#22B573}
body{font-family:'Outfit',sans-serif}
.btn-pro{height:48px;padding:0 18px;border-radius:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.card{border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.06);border:1px solid #EEF2F7;background:white}
.sidebar-active{background:var(--g)!important;color:white!important}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
#overlay.show{display:block!important}
#offlineBadge{display:none}
#offlineBadge.show{display:flex!important}
@media(max-width:1024px){#sidebar{transform:translateX(-100%);position:fixed;z-index:50;top:0;left:0;height:100vh;width:300px;transition:.28s}#sidebar.open{transform:translateX(0)}main{padding:12px!important}.grid-pos{grid-template-columns:1fr!important}}
</style>
</head>
<body class="bg-[#F6F9FB]">
<div class="lg:hidden bg-white border-b p-3 flex items-center justify-between sticky top-0 z-30">
<button onclick="toggleSidebar()" class="w-11 h-11 rounded-xl bg-black text-white">☰</button>
<div class="flex items-center gap-2"><img src="logo.png" class="w-8 h-8"><b class="text-sm" style="color:var(--g)">GRACE OFFLINE</b></div>
<div class="flex items-center gap-2"><div id="offlineBadge" class="px-3 py-1 rounded-full bg-red-600 text-white text-[10px] font-bold">OFFLINE</div><span id="onlineDot" class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span></div>
</div>
<div id="overlay" onclick="toggleSidebar()"></div>

<div id="login" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#22B573]/15 via-white to-[#2D9ED9]/15 p-4">
<div class="bg-white card w-full max-w-[460px] p-6 border-t-[7px]" style="border-color:var(--g)">
<center><img src="logo.png" class="w-24 h-24"><h1 class="text-[18px] font-black mt-4" style="color:var(--g)">GRACE V13.1 OFFLINE PRO</h1><p class="text-[11px] text-gray-500">Works 100% Offline - Auto Sync</p><div id="loginOffline" class="hidden mt-3 px-3 py-2 bg-yellow-100 text-yellow-800 rounded-xl text-xs">⚠️ You are offline - Login with cached password</div></center>
<input id="u" class="w-full h-[52px] border-2 rounded-xl px-5 mt-6" placeholder="Username"><input id="p" type="password" class="w-full h-[52px] border-2 rounded-xl px-5 mt-3" placeholder="Password"><button onclick="doLogin()" class="w-full btn-pro text-white mt-6" style="background:var(--g)">LOGIN</button><p id="loginError" class="text-xs text-red-600 mt-3 hidden text-center"></p>
<div class="mt-4 text-[10px] text-center text-gray-400">Offline Queue: <span id="queueCount">0</span> pending</div>
</div>
</div>

<div id="app" class="hidden min-h-screen flex">
<aside id="sidebar" class="w-[300px] bg-white border-r flex flex-col"><div class="p-5 border-b flex items-center justify-between"><div class="flex items-center gap-3"><img src="logo.png" class="w-10 h-10"><div><b style="color:var(--g)">GRACE OFFLINE</b><div class="text-[11px]"><span id="connStatus" class="text-green-600">● Online</span> | 1$=<span id="rateDisplay">7800</span><div class="text-[10px]">Queue: <span id="queueCount2">0</span></div></div></div></div><button onclick="toggleSidebar()" class="lg:hidden w-8 h-8 bg-gray-100 rounded-full">✕</button></div>
<nav class="p-3 space-y-2 flex-1 overflow-y-auto">
<button onclick="tab('pos')" id="nav-pos" class="w-full btn-pro sidebar-active">POS + Camera</button>
<button onclick="tab('stock')" id="nav-stock" class="w-full btn-pro bg-gray-100">Stock</button>
<button onclick="tab('debt')" id="nav-debt" class="w-full btn-pro bg-gray-100">Debts</button>
<button onclick="tab('delivery')" id="nav-delivery" class="w-full btn-pro bg-gray-100">Delivery</button>
<button onclick="tab('office')" id="nav-office" class="w-full btn-pro bg-gray-100 admin-only hidden">Office Expenses</button>
<button onclick="tab('reports')" id="nav-reports" class="w-full btn-pro bg-gray-100 admin-only hidden">Reports</button>
<button onclick="tab('paysheet')" id="nav-paysheet" class="w-full btn-pro bg-gray-100 admin-only hidden">Paysheet</button>
<button onclick="tab('admin')" id="nav-admin" class="w-full btn-pro bg-gray-100 admin-only hidden">Admin</button>
</nav>
<div class="p-3 border-t"><button onclick="syncOfflineQueue()" class="w-full h-10 rounded-xl bg-[#22B573] text-white text-xs font-bold">🔄 Sync Now</button><button onclick="location.reload()" class="w-full mt-2 h-10 rounded-xl bg-black text-white text-xs">Logout (<span id="userBadge"></span>)</button></div></aside>

<main class="flex-1 p-3 md:p-6 overflow-x-hidden">
<div id="posTab"><div class="grid grid-cols-12 gap-4 grid-pos"><div class="col-span-12 lg:col-span-8 card p-4"><div class="flex gap-2"><input id="barcode" class="flex-1 h-12 border-2 rounded-xl px-4" style="border-color:var(--g)" placeholder="Scan barcode + Enter"><button onclick="startCameraScanner()" id="camBtn" class="btn-pro bg-black text-white">Camera</button></div><div id="reader" class="hidden mt-4 rounded-xl overflow-hidden border-2" style="border-color:var(--g)"><div id="qr-reader"></div><button onclick="stopCameraScanner()" class="w-full h-12 bg-red-600 text-white">Stop</button></div><div class="overflow-x-auto mt-5"><table class="w-full min-w-[500px] text-[13px]"><thead class="bg-[#22B573]/10"><tr><th class="p-3 text-left">MEDICINE</th><th>SSP</th><th>QTY</th><th>TOTAL</th><th></th></tr></thead><tbody id="cart"></tbody></table><p id="cartEmpty" class="text-center text-gray-400 text-sm py-4">Cart empty</p></div></div><div class="col-span-12 lg:col-span-4 card p-4"><h2 class="font-black">Total <span id="totalSSP">0</span> SSP</h2><p>USD $<span id="totalUSD">0</span></p><input id="paidSSP" type="number" placeholder="Paid SSP" class="w-full h-12 border rounded-xl px-4 mt-4"><p class="text-xs mt-2">Change <b id="change">0</b></p><select id="paymentType" class="w-full h-12 border rounded-xl px-4 mt-3"><option value="Cash">Cash</option><option value="Debt">Debt</option><option value="Delivery">Delivery</option></select><input id="debtCustomer" placeholder="Customer" class="w-full h-11 border rounded-xl px-4 mt-2 hidden"><input id="deliveryAddress" placeholder="Address" class="w-full h-11 border rounded-xl px-4 mt-2 hidden"><button onclick="sell()" class="w-full btn-pro text-white mt-4" style="background:var(--g)">SELL - Offline OK</button><div id="receipt" class="hidden p-3 text-[11px] mt-4 border-2 border-dashed"><center><b>GRACE OFFLINE RECEIPT</b></center><div id="rItems"></div><hr>SSP <span id="rTotalSSP"></span> | $<span id="rTotalUSD"></span><br>Rate <span id="rRate"></span><br><span id="rDate"></span> | <span id="rCashier"></span><div id="rQR" class="flex justify-center mt-2"></div></div></div></div></div>
